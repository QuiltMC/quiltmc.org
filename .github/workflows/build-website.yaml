on:
  workflow_call:

name: Build Website

jobs:
  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: 'blob:none'

      - name: Set Up PNPM
        uses: pnpm/setup@v2
        with:
          version: 12
          runtime: node@lts
          cache: true
          require-lockfile: true # Install can't run without Node set up, and Node needs to be set up after PNPM to enable caching

      - name: Build the website
        run: pnpm run build
      - name: Upload HTML artifact
        uses: actions/upload-artifact@v7
        with:
          name: html
          path: |
            dist/
            .wrangler/deploy
          include-hidden-files: true
          retention-days: 1
