on:
  push:
  workflow_call:
    inputs:
      preview-domain:
        type: string
        required: false

name: Commit preview

jobs:
  build-website:
    uses: ./.github/workflows/build-website.yaml

  publish:
    uses: ./.github/workflows/publish-website.yaml
    needs: build-website
    secrets: inherit
    permissions:
      actions: read
      contents: read
    with:
      deploy: ${{ github.ref_name == 'main' }}

  comment-on-commit:
      name: Add a comment on the commit
      runs-on: ubuntu-latest
      needs: publish
      env:
        DEPLOYMENT_URL: ${{ needs.publish.outputs.deployment-url }}
      steps:
          - name: Comment on the Comment
            uses: peter-evans/commit-comment@v4
            with:
              body: "See the preview on Cloudflare: ${{ env.DEPLOYMENT_URL }}\nBranch URL: https://${{ github.ref_name }}-{{ inputs.preview-domain || 'quiltmc-org.quiltmc.workers.dev' }}"
